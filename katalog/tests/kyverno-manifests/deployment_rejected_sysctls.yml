---
# Violates restrict-sysctls: kernel.msgmax is not in the allowed sysctl list.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: deployment-rejected-sysctls
  name: deployment-rejected-sysctls
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      run: deployment-rejected-sysctls
  template:
    metadata:
      labels:
        run: deployment-rejected-sysctls
    spec:
      securityContext:
        sysctls:
          - name: kernel.msgmax
            value: "65536"
      containers:
        - image: registry.sighup.io/fury/redis:5.0.8
          name: deployment-rejected-sysctls
          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "60Mi"
              cpu: "30m"
            limits:
              memory: "80Mi"
              cpu: "50m"
