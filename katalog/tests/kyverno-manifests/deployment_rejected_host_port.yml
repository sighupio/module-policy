---
# Violates disallow-host-ports: binds a host port.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: deployment-rejected-host-port
  name: deployment-rejected-host-port
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      run: deployment-rejected-host-port
  template:
    metadata:
      labels:
        run: deployment-rejected-host-port
    spec:
      containers:
        - image: registry.sighup.io/fury/redis:5.0.8
          name: deployment-rejected-host-port
          ports:
            - containerPort: 8080
              hostPort: 8080
          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "60Mi"
              cpu: "30m"
            limits:
              memory: "80Mi"
              cpu: "50m"
