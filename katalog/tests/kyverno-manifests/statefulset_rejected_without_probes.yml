---
# Rejected: StatefulSet is one of the controllers require-pod-probes autogens
# for, so the missing probes must be caught. Counterpart to
# cronjob_allowed_without_probes.yml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-rejected-without-probes
  namespace: default
spec:
  serviceName: statefulset-rejected-without-probes
  replicas: 1
  selector:
    matchLabels:
      run: statefulset-rejected-without-probes
  template:
    metadata:
      labels:
        run: statefulset-rejected-without-probes
    spec:
      containers:
        - image: registry.sighup.io/fury/redis:5.0.8
          name: statefulset-rejected-without-probes
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "60Mi"
              cpu: "30m"
            limits:
              memory: "80Mi"
              cpu: "50m"
