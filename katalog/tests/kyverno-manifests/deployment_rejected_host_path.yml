---
# Violates disallow-host-path: mounts a hostPath volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: deployment-rejected-host-path
  name: deployment-rejected-host-path
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      run: deployment-rejected-host-path
  template:
    metadata:
      labels:
        run: deployment-rejected-host-path
    spec:
      volumes:
        - name: host-root
          hostPath:
            path: /tmp
      containers:
        - image: registry.sighup.io/fury/redis:5.0.8
          name: deployment-rejected-host-path
          volumeMounts:
            - name: host-root
              mountPath: /host-tmp
          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "60Mi"
              cpu: "30m"
            limits:
              memory: "80Mi"
              cpu: "50m"
