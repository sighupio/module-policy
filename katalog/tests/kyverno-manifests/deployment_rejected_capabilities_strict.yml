---
# Violates disallow-capabilities-strict only: CHOWN is allowed by the lenient policy but strict permits NET_BIND_SERVICE alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: deployment-rejected-capabilities-strict
  name: deployment-rejected-capabilities-strict
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      run: deployment-rejected-capabilities-strict
  template:
    metadata:
      labels:
        run: deployment-rejected-capabilities-strict
    spec:
      containers:
        - image: registry.sighup.io/fury/redis:5.0.8
          name: deployment-rejected-capabilities-strict
          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          resources:
            requests:
              memory: "60Mi"
              cpu: "30m"
            limits:
              memory: "80Mi"
              cpu: "50m"
