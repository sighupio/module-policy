---
# Violates disallow-proc-mount: procMount is Unmasked instead of Default.
# hostUsers must be false: since Kubernetes 1.36 the API server rejects
# procMount: Unmasked without it, before the request reaches Kyverno.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: deployment-rejected-proc-mount
  name: deployment-rejected-proc-mount
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      run: deployment-rejected-proc-mount
  template:
    metadata:
      labels:
        run: deployment-rejected-proc-mount
    spec:
      hostUsers: false
      containers:
        - image: registry.sighup.io/fury/redis:5.0.8
          name: deployment-rejected-proc-mount
          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
            procMount: Unmasked
          resources:
            requests:
              memory: "60Mi"
              cpu: "30m"
            limits:
              memory: "80Mi"
              cpu: "50m"
