---
# Violates disallow-capabilities-strict/require-drop-all: does not drop ALL.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: deployment-rejected-no-drop-all
  name: deployment-rejected-no-drop-all
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      run: deployment-rejected-no-drop-all
  template:
    metadata:
      labels:
        run: deployment-rejected-no-drop-all
    spec:
      containers:
        - image: registry.sighup.io/fury/redis:5.0.8
          name: deployment-rejected-no-drop-all
          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
          resources:
            requests:
              memory: "60Mi"
              cpu: "30m"
            limits:
              memory: "80Mi"
              cpu: "50m"
